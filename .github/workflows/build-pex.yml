name: Build Papyrus (.pex)

# Compiles Mantella's Papyrus sources (Scripts/Source/*.psc) into .pex bytecode
# without requiring Bethesda's Creation Kit. Uses:
#   - russo-2025/papyrus-compiler (open-source, V-implemented, Linux ELF binary)
#   - Rukan/Grimy-Skyrim-Papyrus-Source as community-curated header set for the
#     Bethesda base scripts (Form, Actor, Quest, ObjectReference, ...) plus
#     SkyUI MCM (SKI_*), ConsoleUtil, UIExtensions, StringUtil
#
# Bethesda's Scripts.zip is NOT redistributed by this repo; the stub set is
# fetched at build time from the public Grimy repo (mirror of vanilla CK
# source headers, used by the Skyrim modding community since 2016).

on:
  push:
    paths:
      - 'Scripts/Source/**.psc'
      - '.github/workflows/build-pex.yml'
  pull_request:
    paths:
      - 'Scripts/Source/**.psc'
      - '.github/workflows/build-pex.yml'
  workflow_dispatch:

env:
  # Pinned russo-2025/papyrus-compiler release. v0.0.4 (2026-03-15) is the
  # latest as of this workflow's creation; supports Skyrim SE/AE, has -h
  # (header dir) flag and tolerates header-only stubs marked `native`.
  PAPYRUS_COMPILER_TAG: '2026.03.15'
  PAPYRUS_COMPILER_URL: 'https://github.com/russo-2025/papyrus-compiler/releases/download/2026.03.15/papyrus-compiler-ubuntu.tar.gz'

  # Pinned Grimy headers commit (latest as of workflow creation; repo is
  # dormant — the Skyrim base scripts haven't changed since 2016).
  GRIMY_COMMIT: '4ba71332b4851985240f582a76017216a3bd452f'

  # Targets the user explicitly requires to build (hard failure if any fails).
  REQUIRED_TARGETS: 'MantellaConversation MantellaConstants SKSE_HTTP'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Mantella-Spell
        uses: actions/checkout@v4

      - name: Cache Papyrus compiler binary
        id: cache-pcompiler
        uses: actions/cache@v4
        with:
          path: tools/papyrus-compiler
          key: pcompiler-${{ env.PAPYRUS_COMPILER_TAG }}-ubuntu

      - name: Download Papyrus compiler (russo-2025)
        if: steps.cache-pcompiler.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL -o /tmp/pc.tar.gz "$PAPYRUS_COMPILER_URL"
          tar -C tools -xzf /tmp/pc.tar.gz
          # Archive layout: tools/papyrus-compiler/papyrus
          chmod +x tools/papyrus-compiler/papyrus
          tools/papyrus-compiler/papyrus help || true

      - name: Cache Grimy header set
        id: cache-headers
        uses: actions/cache@v4
        with:
          path: stubs/grimy
          key: grimy-${{ env.GRIMY_COMMIT }}

      - name: Fetch Grimy header set (community-curated stubs)
        if: steps.cache-headers.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p stubs/grimy
          curl -fsSL "https://github.com/Rukan/Grimy-Skyrim-Papyrus-Source/archive/${GRIMY_COMMIT}.tar.gz" -o /tmp/grimy.tar.gz
          tar -C stubs/grimy --strip-components=1 -xzf /tmp/grimy.tar.gz
          # Keep only .psc files (drop .gitignore, README junk).
          find stubs/grimy -type f ! -name '*.psc' -delete
          echo "Fetched $(find stubs/grimy -name '*.psc' | wc -l) base header .psc files"

      - name: Prepare build dirs
        run: |
          set -euo pipefail
          mkdir -p build/pex build/to-compile
          # Headers dir: full Mantella source tree (so intra-mod symbols
          # resolve as headers when compiling our targets).
          mkdir -p build/headers
          cp -R Scripts/Source/. build/headers/
          # Inputs: only the targets we actually want .pex for. Everything
          # else (MCM, advanced actions referencing PapyrusUtil/UIExtensions
          # internals not in Grimy) stays as headers so its declarations
          # are visible without having to compile them.
          for target in $REQUIRED_TARGETS; do
            cp "Scripts/Source/${target}.psc" "build/to-compile/${target}.psc"
          done
          ls build/to-compile

      - name: Compile required targets
        # The compiler aborts the entire batch on any error in the input set
        # (-i). Keep that set narrow — only the .psc we patched. Everything
        # else lives in -h headers/build/headers and is consulted by name only.
        run: |
          set -euo pipefail
          PC=tools/papyrus-compiler/papyrus
          "$PC" compile \
            -nocache \
            -h stubs/grimy \
            -h build/headers \
            -i build/to-compile \
            -o build/pex
          echo "---"
          echo "Built .pex files:"
          for p in build/pex/*.pex; do
            [ -f "$p" ] && printf '  %s (%s bytes)\n' "$(basename "$p")" "$(stat -c '%s' "$p")"
          done

      - name: Verify required targets compiled
        run: |
          set -euo pipefail
          missing=0
          for target in $REQUIRED_TARGETS; do
            if [ ! -f "build/pex/${target}.pex" ]; then
              echo "::error::Missing build/pex/${target}.pex"
              missing=$((missing+1))
            else
              echo "  OK: ${target}.pex"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::${missing} required target(s) failed to compile"
            exit 1
          fi

      - name: Upload .pex artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mantella-Spell-pex
          path: build/pex/*.pex
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Papyrus build"
            echo ""
            echo "Compiler: russo-2025/papyrus-compiler @ \`${PAPYRUS_COMPILER_TAG}\`"
            echo "Headers : Rukan/Grimy-Skyrim-Papyrus-Source @ \`${GRIMY_COMMIT:0:7}\`"
            echo ""
            echo "| File | Size |"
            echo "|------|-----:|"
            if [ -d build/pex ]; then
              for f in build/pex/*.pex; do
                [ -f "$f" ] || continue
                echo "| \`$(basename "$f")\` | $(stat -c '%s' "$f") |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
